<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zeta Network — Réseau Social Décentralisé</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --red: #FF3B5C;
  --purple: #7B2FFF;
  --teal: #00C9A7;
  --orange: #FF6B35;
  --gold: #F7B731;
  --bg: #0A0A0F;
  --bg2: #12121A;
  --bg3: #1A1A26;
  --border: rgba(255,255,255,0.07);
  --text: #F0F0FF;
  --muted: #6B6B88;
  --card: rgba(255,255,255,0.04);
  --glass: rgba(255,255,255,0.06);
  --font-display: 'Syne', sans-serif;
  --font-body: 'DM Sans', sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
  --radius: 18px;
  --radius-sm: 12px;
  --nav-h: 64px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  font-family: var(--font-body);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}

/* Grain texture */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
  pointer-events: none;
  z-index: 9999;
  opacity: 0.4;
}

/* ── NAVBAR ── */
.navbar {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: var(--nav-h);
  background: rgba(10, 10, 15, 0.85);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 24px;
  z-index: 100;
}

.nav-logo {
  font-family: var(--font-display);
  font-size: 22px;
  font-weight: 800;
  letter-spacing: -0.5px;
  background: linear-gradient(135deg, var(--red), var(--purple));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  text-decoration: none;
}

.nav-logo span {
  font-weight: 400;
  background: linear-gradient(135deg, var(--purple), var(--teal));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.nav-links {
  display: flex;
  gap: 4px;
  list-style: none;
}

.nav-links a {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 16px;
  border-radius: 40px;
  color: var(--muted);
  text-decoration: none;
  font-size: 14px;
  font-weight: 500;
  transition: all 0.2s;
}

.nav-links a:hover,
.nav-links a.active {
  color: var(--text);
  background: var(--glass);
}

.nav-links a.active {
  color: var(--red);
}

.nav-right {
  display: flex;
  align-items: center;
  gap: 12px;
}

.nav-avatar {
  width: 36px; height: 36px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--red), var(--purple));
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 700;
  cursor: pointer;
  border: 2px solid transparent;
  background-clip: padding-box;
  position: relative;
}

.nav-avatar::before {
  content: '';
  position: absolute;
  inset: -2px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--red), var(--purple));
  z-index: -1;
}

.notif-dot {
  width: 8px; height: 8px;
  background: var(--red);
  border-radius: 50%;
  border: 2px solid var(--bg);
  position: absolute;
  top: -2px; right: -2px;
}

/* ── LAYOUT ── */
.main-layout {
  display: grid;
  grid-template-columns: 280px 1fr 300px;
  gap: 0;
  max-width: 1280px;
  margin: 0 auto;
  padding-top: var(--nav-h);
  min-height: 100vh;
}

/* ── SIDEBAR LEFT ── */
.sidebar-left {
  padding: 32px 20px;
  border-right: 1px solid var(--border);
  position: sticky;
  top: var(--nav-h);
  height: calc(100vh - var(--nav-h));
  overflow-y: auto;
}

.sidebar-left::-webkit-scrollbar { width: 0; }

.sidebar-section {
  margin-bottom: 32px;
}

.sidebar-label {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 2px;
  color: var(--muted);
  text-transform: uppercase;
  margin-bottom: 12px;
  padding-left: 12px;
}

.sidebar-menu {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.sidebar-menu a {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 11px 14px;
  border-radius: var(--radius-sm);
  color: var(--muted);
  text-decoration: none;
  font-size: 15px;
  font-weight: 500;
  transition: all 0.2s;
  position: relative;
}

.sidebar-menu a:hover {
  color: var(--text);
  background: var(--glass);
}

.sidebar-menu a.active {
  color: var(--text);
  background: rgba(255, 59, 92, 0.12);
}

.sidebar-menu a.active .menu-icon {
  color: var(--red);
}

.menu-icon {
  font-size: 18px;
  width: 24px;
  text-align: center;
}

.badge {
  margin-left: auto;
  background: var(--red);
  color: white;
  font-size: 10px;
  font-weight: 700;
  padding: 2px 7px;
  border-radius: 20px;
  font-family: var(--font-mono);
}

/* Node info card */
.node-card {
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  margin-top: 8px;
}

.node-status {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 12px;
}

.status-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--teal);
  box-shadow: 0 0 8px var(--teal);
  animation: pulse-dot 2s infinite;
}

@keyframes pulse-dot {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.6; transform: scale(0.8); }
}

.node-id {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--muted);
}

.node-stats {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.node-stat {
  background: var(--bg2);
  border-radius: 8px;
  padding: 8px 10px;
}

.node-stat-val {
  font-family: var(--font-mono);
  font-size: 15px;
  font-weight: 600;
  color: var(--text);
}

.node-stat-lbl {
  font-size: 10px;
  color: var(--muted);
  margin-top: 2px;
}

/* Compose button */
.compose-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  width: 100%;
  padding: 13px 20px;
  border-radius: 40px;
  background: linear-gradient(135deg, var(--red), var(--purple));
  color: white;
  font-family: var(--font-body);
  font-size: 15px;
  font-weight: 600;
  border: none;
  cursor: pointer;
  transition: all 0.3s;
  margin-top: 8px;
  text-decoration: none;
}

.compose-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 30px rgba(255, 59, 92, 0.4);
}

/* ── FEED ── */
.feed {
  border-right: 1px solid var(--border);
}

.feed-header {
  padding: 20px 24px 0;
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: var(--nav-h);
  background: rgba(10, 10, 15, 0.9);
  backdrop-filter: blur(20px);
  z-index: 10;
}

.feed-title {
  font-family: var(--font-display);
  font-size: 20px;
  font-weight: 700;
  margin-bottom: 16px;
}

.feed-tabs {
  display: flex;
  gap: 0;
}

.feed-tab {
  padding: 12px 24px;
  font-size: 14px;
  font-weight: 600;
  color: var(--muted);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: all 0.2s;
  white-space: nowrap;
}

.feed-tab.active {
  color: var(--text);
  border-bottom-color: var(--red);
}

/* ── STORIES ── */
.stories-bar {
  padding: 20px 24px;
  border-bottom: 1px solid var(--border);
  display: flex;
  gap: 16px;
  overflow-x: auto;
}

.stories-bar::-webkit-scrollbar { height: 0; }

.story-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  cursor: pointer;
  flex-shrink: 0;
}

.story-ring {
  width: 56px; height: 56px;
  border-radius: 50%;
  padding: 2px;
  background: var(--bg3);
  position: relative;
}

.story-ring.has-story {
  background: linear-gradient(135deg, var(--red), var(--purple), var(--teal));
}

.story-avatar {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 15px;
  font-weight: 700;
  border: 2px solid var(--bg);
}

.story-add {
  position: absolute;
  bottom: 0; right: 0;
  width: 18px; height: 18px;
  background: var(--red);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px;
  color: white;
  border: 2px solid var(--bg);
}

.story-name {
  font-size: 11px;
  color: var(--muted);
  text-align: center;
  max-width: 60px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* ── POST CARD ── */
.post-card {
  padding: 20px 24px;
  border-bottom: 1px solid var(--border);
  transition: background 0.2s;
  animation: fadeInUp 0.4s ease both;
}

.post-card:hover { background: rgba(255,255,255,0.02); }

@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: translateY(0); }
}

.post-header {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  margin-bottom: 12px;
}

.post-avatar {
  width: 44px; height: 44px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 700;
  flex-shrink: 0;
  cursor: pointer;
}

.post-meta {
  flex: 1;
}

.post-username {
  font-size: 15px;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 6px;
}

.verified-badge {
  width: 16px; height: 16px;
  background: var(--red);
  border-radius: 50%;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 9px;
}

.post-fp {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--muted);
  margin-top: 2px;
}

.post-time {
  font-size: 12px;
  color: var(--muted);
}

.post-content {
  font-size: 15px;
  line-height: 1.65;
  color: var(--text);
  margin-bottom: 12px;
}

.post-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 8px;
}

.tag {
  font-size: 13px;
  color: var(--purple);
  font-weight: 500;
  cursor: pointer;
}

.tag:hover { text-decoration: underline; }

/* Post media */
.post-media {
  border-radius: var(--radius-sm);
  overflow: hidden;
  margin-bottom: 14px;
  background: var(--bg3);
  border: 1px solid var(--border);
}

.media-network {
  height: 200px;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
}

.network-viz {
  width: 100%;
  height: 100%;
}

.media-stats {
  padding: 16px 20px;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
}

.stat-block {
  text-align: center;
}

.stat-big {
  font-family: var(--font-mono);
  font-size: 22px;
  font-weight: 600;
  background: linear-gradient(135deg, var(--teal), var(--purple));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.stat-label {
  font-size: 11px;
  color: var(--muted);
  margin-top: 2px;
}

.media-code {
  padding: 16px;
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--teal);
  line-height: 1.6;
}

/* Post actions */
.post-actions {
  display: flex;
  align-items: center;
  gap: 0;
  margin-top: 4px;
}

.action-btn {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 8px 14px;
  border-radius: 40px;
  border: none;
  background: none;
  color: var(--muted);
  font-size: 13px;
  font-family: var(--font-body);
  cursor: pointer;
  transition: all 0.2s;
  font-weight: 500;
}

.action-btn:hover { background: var(--glass); }

.action-btn.like:hover { color: var(--red); }
.action-btn.comment:hover { color: var(--purple); }
.action-btn.repost:hover { color: var(--teal); }
.action-btn.send:hover { color: var(--gold); }

.action-icon { font-size: 16px; }

/* ── SIDEBAR RIGHT ── */
.sidebar-right {
  padding: 32px 20px;
  position: sticky;
  top: var(--nav-h);
  height: calc(100vh - var(--nav-h));
  overflow-y: auto;
}

.sidebar-right::-webkit-scrollbar { width: 0; }

.widget {
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  margin-bottom: 20px;
}

.widget-title {
  font-family: var(--font-display);
  font-size: 16px;
  font-weight: 700;
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 8px;
}

/* Trending */
.trend-item {
  padding: 10px 0;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.trend-item:last-child { border-bottom: none; }
.trend-item:hover { padding-left: 4px; }

.trend-tag {
  font-weight: 600;
  font-size: 14px;
  color: var(--text);
}

.trend-count {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--muted);
}

.trend-rank {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--muted);
  margin-bottom: 2px;
}

/* Suggested users */
.suggest-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 0;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
}

.suggest-item:last-child { border-bottom: none; }

.suggest-avatar {
  width: 38px; height: 38px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 700;
  flex-shrink: 0;
}

.suggest-info { flex: 1; }

.suggest-name {
  font-size: 13px;
  font-weight: 600;
}

.suggest-fp {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--muted);
}

.follow-btn {
  padding: 5px 14px;
  border-radius: 20px;
  border: 1px solid var(--red);
  background: none;
  color: var(--red);
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  font-family: var(--font-body);
}

.follow-btn:hover {
  background: var(--red);
  color: white;
}

/* BTC widget */
.btc-address-card {
  background: var(--bg2);
  border-radius: var(--radius-sm);
  padding: 14px;
  margin-top: 12px;
}

.btc-label {
  font-size: 10px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 6px;
}

.btc-addr {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--gold);
  word-break: break-all;
  line-height: 1.5;
}

.btc-balance {
  font-family: var(--font-mono);
  font-size: 24px;
  font-weight: 600;
  color: var(--gold);
  text-align: center;
  padding: 8px 0;
}

.btc-sub {
  font-size: 12px;
  color: var(--muted);
  text-align: center;
}

/* ── NETWORK VIZ SVG ── */
.net-node {
  animation: float-node 3s ease-in-out infinite;
}

@keyframes float-node {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-4px); }
}

/* ── RESPONSIVE ── */
@media (max-width: 1100px) {
  .main-layout { grid-template-columns: 240px 1fr 0; }
  .sidebar-right { display: none; }
}

@media (max-width: 768px) {
  .main-layout { grid-template-columns: 1fr; }
  .sidebar-left { display: none; }
  .navbar { padding: 0 16px; }
}

/* ── ANIMATIONS stagger ── */
.post-card:nth-child(1) { animation-delay: 0.05s; }
.post-card:nth-child(2) { animation-delay: 0.10s; }
.post-card:nth-child(3) { animation-delay: 0.15s; }
.post-card:nth-child(4) { animation-delay: 0.20s; }
.post-card:nth-child(5) { animation-delay: 0.25s; }

/* ── PULSE RING animation ── */
@keyframes spin-ring {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

.live-indicator {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: rgba(0, 201, 167, 0.1);
  border: 1px solid rgba(0, 201, 167, 0.3);
  padding: 4px 10px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 600;
  color: var(--teal);
  letter-spacing: 0.5px;
}

/* ── COMPOSE AREA ── */
.compose-area {
  padding: 20px 24px;
  border-bottom: 1px solid var(--border);
  display: flex;
  gap: 12px;
}

.compose-input-wrap {
  flex: 1;
}

.compose-input {
  width: 100%;
  background: none;
  border: none;
  color: var(--text);
  font-family: var(--font-body);
  font-size: 16px;
  outline: none;
  resize: none;
  min-height: 60px;
  placeholder-color: var(--muted);
}

.compose-input::placeholder { color: var(--muted); }

.compose-actions {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-top: 12px;
  border-top: 1px solid var(--border);
}

.compose-tools {
  display: flex;
  gap: 4px;
}

.compose-tool {
  padding: 8px;
  border-radius: 8px;
  border: none;
  background: none;
  color: var(--muted);
  cursor: pointer;
  font-size: 18px;
  transition: all 0.2s;
}

.compose-tool:hover {
  color: var(--purple);
  background: var(--glass);
}

.post-btn {
  padding: 9px 22px;
  border-radius: 40px;
  background: linear-gradient(135deg, var(--red), var(--purple));
  color: white;
  font-family: var(--font-body);
  font-size: 14px;
  font-weight: 600;
  border: none;
  cursor: pointer;
  transition: all 0.2s;
}

.post-btn:hover {
  opacity: 0.9;
  transform: scale(1.02);
}
</style>
{% block extra_style %}{% endblock %}
</head>
<body>

<nav class="navbar">
  <a class="nav-logo" href="/">Zeta <span>Network</span></a>
  <ul class="nav-links">
    <li><a href="/" class="{{ 'active' if request.path == '/' }}">
      <span>🏠</span> Accueil
    </a></li>
    <li><a href="/explore" class="{{ 'active' if request.path == '/explore' }}">
      <span>🔍</span> Explorer
    </a></li>
    <li><a href="/network" class="{{ 'active' if request.path == '/network' }}">
      <span>🌐</span> Réseau
    </a></li>
    <li><a href="/wallet" class="{{ 'active' if request.path == '/wallet' }}">
      <span>💰</span> Wallet
    </a></li>
  </ul>
  <div class="nav-right">
    <div class="live-indicator">● LIVE</div>
    <a href="/profile" style="position:relative; display:block;">
      <div class="nav-avatar" style="background: linear-gradient(135deg, #FF3B5C, #7B2FFF); -webkit-text-fill-color: white; font-size: 13px;">
        Moi
      </div>
      <div class="notif-dot"></div>
    </a>
  </div>
</nav>

{% block body %}{% endblock %}

<script>
// Like animation
document.querySelectorAll('.action-btn.like').forEach(btn => {
  btn.addEventListener('click', function() {
    const count = this.querySelector('.action-count');
    const icon = this.querySelector('.action-icon');
    const num = parseInt(count.textContent.replace(/[^0-9]/g, ''));
    const liked = this.dataset.liked === 'true';
    if (liked) {
      count.textContent = formatNum(num - 1);
      icon.textContent = '🤍';
      this.dataset.liked = 'false';
      this.style.color = '';
    } else {
      count.textContent = formatNum(num + 1);
      icon.textContent = '❤️';
      this.dataset.liked = 'true';
      this.style.color = '#FF3B5C';
      // Micro-bounce
      icon.style.transform = 'scale(1.4)';
      setTimeout(() => icon.style.transform = '', 200);
    }
  });
});

function formatNum(n) {
  if (n >= 1000) return (n/1000).toFixed(1) + 'K';
  return n.toString();
}
</script>
{% block extra_script %}{% endblock %}
</body>
